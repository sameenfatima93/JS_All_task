<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz App</title>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
  }

  /* NAVBAR */
  .navbar {
    background: #1f1f1f;
    padding: 15px 25px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .navbar .title {
    font-size: 20px;
    font-weight: bold;
  }

  .profile-container {
    position: relative;
    cursor: pointer;
  }

  .profile-pic {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 2px solid #fff;
    object-fit: cover;
  }

  #uploadInput {
    display: none;
  }

  /* QUIZ CARD */
  .container {
    width: 400px;
    background: white;
    padding: 20px;
    margin: 30px auto;
    border-radius: 12px;
    box-shadow: 0 0 15px #ccc;
  }

  button {
    padding: 10px 18px;
    margin: 10px 5px;
    border: none;
    /* background: #222222; */
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }
  .prbtn{
    background-color: rgb(187, 73, 2);
}

.nxbtn{
      background-color: rgb(62, 8, 113);

  }

  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }

  .btn-box {
    display: flex;
    justify-content: space-between;
  }

  .option {
    margin: 10px 0;
    background: #eee;
    padding: 10px;
    border-radius: 8px;
  }
</style>
</head>

<body>

<!-- NAVBAR START -->
<div class="navbar">
  <div class="title">🔥 HTML & CSS Quiz</div>

  <div class="profile-container">
    <img src="default.jpg" id="profilePic" class="profile-pic">
    <input type="file" id="uploadInput" accept="image/*">
  </div>
</div>
<!-- NAVBAR END -->
 
<!-- Progress Bar -->
<div id="progressBarContainer" style="width:100%; height:8px; background:#ddd;">
  <div id="progressBar" style="height:100%; width:0%; background:#3498db; transition:0.4s;"></div>
</div>

<!-- Timer -->
<div style="text-align:center; margin-top:10px;">
  <h3>Time Left: <span id="timer" style="color:#27ae60;">60</span> sec</h3>
</div>


<div class="container">
  <h2 id="question"></h2>
  <div id="options"></div>

  <div class="btn-box">
    <button id="prevBtn" class="prbtn">Previous</button>
    <button id="nextBtn" class="nxbtn" disabled>Next</button>
  </div>
</div>

<script src="quiz.js"></script>
</body>
</html>
